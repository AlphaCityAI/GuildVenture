
[project]
name = "guildventure"
version = "0.2.0"
description = "Cooperative cyberpunk Telegram RPG"
requires-python = ">=3.11,<3.15"
dependencies = [
    "asyncpg==0.31.0",
    "openai==1.77.0",
    "python-telegram-bot==22.0",
    "httpx==0.28.1",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: disposable PostgreSQL tests (TEST_DATABASE_URL)"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["audit"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
